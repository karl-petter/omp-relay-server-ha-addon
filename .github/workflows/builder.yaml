name: Builder

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-24.04
    outputs:
      architectures: ${{ steps.info.outputs.architectures }}
      build_matrix: ${{ steps.matrix.outputs.matrix }}
      image_name: ${{ steps.normalize.outputs.image_name }}
      registry_prefix: ${{ steps.normalize.outputs.registry_prefix }}
      name: ${{ steps.normalize.outputs.name }}
      description: ${{ steps.normalize.outputs.description }}
      url: ${{ steps.normalize.outputs.url }}
      version: ${{ steps.normalize.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get add-on information
        id: info
        uses: home-assistant/actions/helpers/info@06749dd8c0b54f350bc69c8752456cee498808a3 # master (2026-10-11)
        with:
          path: "./omp-collab-relay"

      - name: Normalize add-on information
        id: normalize
        env:
          IMAGE_JSON: ${{ steps.info.outputs.image }}
          NAME_JSON: ${{ steps.info.outputs.name }}
          DESCRIPTION_JSON: ${{ steps.info.outputs.description }}
          URL_JSON: ${{ steps.info.outputs.url }}
          VERSION_JSON: ${{ steps.info.outputs.version }}
        run: |
          image=$(jq -r . <<<"$IMAGE_JSON")
          echo "image_name=${image##*/}" >> "$GITHUB_OUTPUT"
          echo "registry_prefix=${image%/*}" >> "$GITHUB_OUTPUT"
          echo "name=$(jq -r . <<<"$NAME_JSON")" >> "$GITHUB_OUTPUT"
          echo "description=$(jq -r . <<<"$DESCRIPTION_JSON")" >> "$GITHUB_OUTPUT"
          echo "url=$(jq -r . <<<"$URL_JSON")" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r . <<<"$VERSION_JSON")" >> "$GITHUB_OUTPUT"

      - name: Prepare multi-arch build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@7412f0023ea9b6e58e8bb5059f1660f51376f49a # 2026.09.0
        with:
          architectures: ${{ steps.info.outputs.architectures }}
          image-name: ${{ steps.normalize.outputs.image_name }}
          registry-prefix: ${{ steps.normalize.outputs.registry_prefix }}

  audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Determine the pinned oh-my-pi commit
        id: pin
        run: |
          sha=$(grep -oP '^ARG OMP_SHA=\K.*' omp-collab-relay/Dockerfile)
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Clone the pinned source and install the relay's dependencies
        env:
          SHA: ${{ steps.pin.outputs.sha }}
        run: |
          mkdir /tmp/oh-my-pi && cd /tmp/oh-my-pi
          git init -q
          git remote add origin https://github.com/can1357/oh-my-pi.git
          git fetch --depth 1 origin "${SHA}"
          git checkout -q FETCH_HEAD
          bun install --production --filter '!./' --filter '@oh-my-pi/collab-web...'

      - name: Audit only the packages this image actually ships
        working-directory: /tmp/oh-my-pi
        run: |
          installed=$(find -L node_modules -name package.json -exec jq -r '.name // empty' {} \; | sort -u)
          bun audit --json > /tmp/audit.json 2>/tmp/audit-text.txt || true
          cat /tmp/audit-text.txt
          vulnerable=$(jq -r 'keys[]' /tmp/audit.json 2>/dev/null | sort -u)
          shipped_vulnerable=$(comm -12 <(echo "$installed") <(echo "$vulnerable"))
          if [[ -n "$shipped_vulnerable" ]]; then
            echo "::error::Known vulnerabilities in packages this image actually ships: $(echo "$shipped_vulnerable" | tr '\n' ' ')"
            exit 1
          fi
          echo "No known vulnerabilities in the shipped dependency tree."

  build:
    name: Build ${{ matrix.arch }} image
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.build_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        uses: home-assistant/builder/actions/build-image@7412f0023ea9b6e58e8bb5059f1660f51376f49a # 2026.09.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: "./omp-collab-relay"
          image: ${{ matrix.image }}
          image-tags: |
            ${{ github.event_name == 'push' && needs.prepare.outputs.version || 'pr-smoke' }}
            ${{ github.event_name == 'push' && 'latest' || '' }}
          labels: |
            io.hass.type=app
            io.hass.name=${{ needs.prepare.outputs.name }}
            io.hass.description=${{ needs.prepare.outputs.description }}
            io.hass.url=${{ needs.prepare.outputs.url }}
          push: ${{ github.event_name == 'push' }}
          load: ${{ github.event_name == 'pull_request' }}
          version: ${{ needs.prepare.outputs.version }}

      - name: Set up Node for the smoke test
        if: github.event_name == 'pull_request'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Run relay contract smoke test
        if: github.event_name == 'pull_request'
        timeout-minutes: 3
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          docker run -d --name relay-smoke -p 7466:7466 "${IMAGE}:pr-smoke"
          for i in $(seq 1 20); do
            if docker logs relay-smoke 2>&1 | grep -q "listening on"; then
              break
            fi
            if [ "$i" -eq 20 ]; then
              echo "::error::relay container never logged its listening line"
              docker logs relay-smoke
              docker rm -f relay-smoke
              exit 1
            fi
            sleep 0.5
          done
          node test/relay-smoke.mjs
          docker logs relay-smoke
          docker rm -f relay-smoke

  manifest:
    name: Publish multi-arch manifest
    needs: [prepare, audit, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Publish multi-arch manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@7412f0023ea9b6e58e8bb5059f1660f51376f49a # 2026.09.0
        with:
          architectures: ${{ needs.prepare.outputs.architectures }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ needs.prepare.outputs.image_name }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          registry-prefix: ${{ needs.prepare.outputs.registry_prefix }}
